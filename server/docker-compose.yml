services:
  backend:
    build: .
    container_name: stagetimer-backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: production
    expose:
      - "3001"
    networks:
      - vetsanare-network

networks:
  vetsanare-network:
    name: vetsanare_vetsanare-net
    external: true
